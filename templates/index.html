<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Website Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 45px 35px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .description {
            color: #555;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Phishing Website Detector</h1>

        <p class="description">
            Check whether a website URL is legitimate or suspicious.
        </p>

        <form action="/predict" method="POST">

            <input
                type="text"
                name="url"
                placeholder="Enter website URL"
                required
            >

            <button type="submit">
                🔍 Check Website
            </button>

        </form>

        <p class="info">
            Enter a complete URL starting with http:// or https://
        </p>

    </div>

</body>
</html>
